# Chave da API da Anthropic (obrigatória)
anthropic.api-key=

# URL base da API (opcional; deixe em branco para usar a padrão)
anthropic.base-url=https://api.anthropic.com

# ---- Lab a01p ----
# Modelo usado no passo 2 (cinco vezes)
a01p.modelo=claude-opus-5

# Temperatura do passo 2. Deixe em branco para não enviar.
# No claude-opus-5 qualquer valor dá erro 400; teste com modelo=claude-haiku-4-5 e temperatura=0
a01p.temperatura=

# ---- Lab a02p ----
# Passo 1 (chamada crua): true tira o cabecalho anthropic-version e a API devolve erro 400.
a02p.sem-versao=false

# Passo 3 (multi-turno): true manda so a pergunta da vez, sem o historico.
a02p.esquecer=true
